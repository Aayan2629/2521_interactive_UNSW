<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BST Rotation Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f3; --panel:#ffffff; --border:#e7e5df; --text:#1c1c1e; --muted:#74747a; --faint:#a3a3a8;
  --chip:#efeee9; --code-bg:#fbfbf9;
  --accent:#2f6fed; --accent-soft:#e3ecfe; --line-active:#eaf1ff;
  --violet:#8b5cf6; --violet-soft:#efe8ff;
  --amber:#d99206; --amber-soft:#fdf1d6;
  --teal:#0f9f8f; --teal-soft:#dbf4f0;
  --rose:#e5484d;
  --node:#ffffff; --node-stroke:#c8c6bf; --edge:#b9b7b0;
  --kw:#c2416b; --fn:#2f6fed; --num:#b26a00; --cm:#9a9aa0;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121214; --panel:#1b1b1e; --border:#2b2b30; --text:#ececef; --muted:#9a9aa2; --faint:#64646b;
    --chip:#26262b; --code-bg:#17171a;
    --accent:#6b9bff; --accent-soft:#1d2a47; --line-active:#1c2740;
    --violet:#a78bfa; --violet-soft:#2b2343;
    --amber:#f0b429; --amber-soft:#3a2d10;
    --teal:#2dd4bf; --teal-soft:#123532;
    --rose:#ff6b70;
    --node:#232328; --node-stroke:#4a4a52; --edge:#55555d;
    --kw:#f27aa0; --fn:#7fa8ff; --num:#f0b45a; --cm:#6c6c74;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121214; --panel:#1b1b1e; --border:#2b2b30; --text:#ececef; --muted:#9a9aa2; --faint:#64646b;
  --chip:#26262b; --code-bg:#17171a;
  --accent:#6b9bff; --accent-soft:#1d2a47; --line-active:#1c2740;
  --violet:#a78bfa; --violet-soft:#2b2343;
  --amber:#f0b429; --amber-soft:#3a2d10;
  --teal:#2dd4bf; --teal-soft:#123532;
  --rose:#ff6b70;
  --node:#232328; --node-stroke:#4a4a52; --edge:#55555d;
  --kw:#f27aa0; --fn:#7fa8ff; --num:#f0b45a; --cm:#6c6c74;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:22px 16px 40px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:500 13px Inter,system-ui,sans-serif;padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--text)}
button:focus{outline:none} button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.setup{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;padding:14px 16px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input[type=text],input[type=number],select{font:500 13px "JetBrains Mono",ui-monospace,monospace;color:var(--text);background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:7px 10px;outline:none;min-width:0}
input:focus,select:focus{border-color:var(--accent)}
#treeInput{width:260px;max-width:100%}
#param{width:90px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--border);background:transparent;color:var(--muted);font:500 12px Inter,system-ui,sans-serif;padding:6px 10px;border-radius:999px;cursor:pointer}
.chipbtn:hover{color:var(--text);border-color:var(--faint)}
.check{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none;padding-bottom:7px}
.check input{accent-color:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:14px;align-items:stretch}
.codecard{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cardhead{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.code{font:12.5px/1.75 "JetBrains Mono",ui-monospace,monospace;background:var(--code-bg);padding:10px 0;overflow:auto;max-height:470px;flex:1}
.fnblock{transition:opacity .3s}
.fnblock.dim{opacity:.38}
.fnblock+.fnblock{margin-top:12px}
.ln{display:flex;white-space:pre;padding-right:14px;position:relative;transition:background .2s}
.ln .no{width:38px;flex:none;text-align:right;padding-right:14px;color:var(--faint);user-select:none}
.ln.active{background:var(--line-active)}
.ln.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:0 2px 2px 0}
.ln.active .no{color:var(--accent);font-weight:600}
.ln.caller{background:color-mix(in srgb,var(--chip) 70%,transparent)}
.ln.caller::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--faint)}
.kw{color:var(--kw)} .fn{color:var(--fn)} .num{color:var(--num)} .cm{color:var(--cm);font-style:italic}
.state{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border)}
.state>div{padding:10px 14px;min-width:0}
.state>div+div{border-left:1px solid var(--border)}
.state h3{margin:0 0 6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stack{display:flex;flex-direction:column-reverse;gap:3px;font:12px "JetBrains Mono",ui-monospace,monospace}
.stack div{padding:3px 7px;border-radius:6px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack div.top{background:var(--accent-soft);color:var(--accent);font-weight:600}
.vars{font:12px "JetBrains Mono",ui-monospace,monospace;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.vars .k{color:var(--muted)} .vars .v{font-weight:600}
.vars .v.null{color:var(--faint);font-weight:400}
.empty{color:var(--faint);font-size:12px}
.viz{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.msg{padding:14px 18px;border-bottom:1px solid var(--border);min-height:62px;display:flex;gap:12px;align-items:flex-start}
.msg .badge{flex:none;font:600 11px "JetBrains Mono",monospace;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px;margin-top:1px}
.msg .text{font-size:14.5px}
.msg code{font:500 12.5px "JetBrains Mono",monospace;background:var(--chip);padding:1px 5px;border-radius:5px}
.nv{display:inline-block;min-width:22px;text-align:center;font:600 12.5px "JetBrains Mono",monospace;padding:0 5px;border-radius:999px;border:1.5px solid var(--node-stroke)}
.stage{position:relative;flex:1;min-height:380px}
@media (max-width:900px){.stage{min-height:300px}}
svg#tree{position:absolute;inset:0;width:100%;height:100%;display:block}
.node{cursor:default}
.mode-rotR .node,.mode-rotL .node{cursor:pointer}
.node circle.body{fill:var(--node);stroke:var(--node-stroke);stroke-width:2;transition:fill .3s,stroke .3s}
.node text.val{font:600 14px "JetBrains Mono",monospace;fill:var(--text);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node.cur circle.body{fill:var(--accent-soft);stroke:var(--accent)}
.node.new circle.body{fill:var(--violet-soft);stroke:var(--violet)}
.node.moved circle.body{fill:var(--amber-soft);stroke:var(--amber)}
.node.count circle.body{fill:var(--teal-soft);stroke:var(--teal)}
.node circle.ring{fill:none;stroke:var(--rose);stroke-width:1.8;stroke-dasharray:4 3;opacity:0;transition:opacity .3s}
.node.target circle.ring{opacity:1}
.node:hover circle.body{stroke-width:2.6}
text.idx{font:500 10.5px "JetBrains Mono",monospace;fill:var(--faint);text-anchor:middle}
.edge{fill:none;stroke:var(--edge);stroke-width:2;marker-end:url(#arr);transition:stroke .3s}
.edge.hot{stroke:var(--accent);stroke-width:2.6;marker-end:url(#arrHot)}
#arr path{fill:var(--edge)} #arrHot path{fill:var(--accent)}
.tag rect{fill:var(--accent)} .tag text{fill:#fff;font:600 11px "JetBrains Mono",monospace;text-anchor:middle;dominant-baseline:central}
.tag.muted rect{fill:var(--chip);stroke:var(--border)} .tag.muted text{fill:var(--muted)}
.tag.violet rect{fill:var(--violet)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 18px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:50%;border:2px solid;display:inline-block}
.player{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--border);flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;width:44px}
.btn svg{width:16px;height:16px}
#scrub{flex:1;min-width:120px;accent-color:var(--accent)}
.count{font:500 12px "JetBrains Mono",monospace;color:var(--muted);min-width:64px;text-align:right}
.textbtn{border:1px solid var(--border);background:transparent;color:var(--muted);font:500 12px Inter,system-ui,sans-serif;padding:7px 10px;border-radius:8px;cursor:pointer}
.textbtn:hover{color:var(--text)}
.hint{color:var(--faint);font-size:12px;margin-top:10px;text-align:center}
.hint kbd{font:500 11px "JetBrains Mono",monospace;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}
@media (max-width:900px){
  .grid{grid-template-columns:1fr}
  .viz{order:-1}
  .code{max-height:320px}
  #treeInput{width:100%}
  .setup .field.grow{flex:1 1 100%}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>BST Rotation Visualizer</h1>
      <div class="sub">Step through the code line by line and watch the pointers move · COMP2521 Balancing BSTs</div>
    </div>
    <div class="seg" id="modes">
      <button data-mode="rotR">rotateRight</button>
      <button data-mode="rotL">rotateLeft</button>
      <button data-mode="insert">insertAtRoot</button>
      <button data-mode="part">partition</button>
      <button data-mode="rebal">rebalance</button>
    </div>
  </header>

  <div class="card setup">
    <div class="field grow">
      <label for="treeInput">Tree (inserted in order)</label>
      <input type="text" id="treeInput" spellcheck="false">
    </div>
    <div class="field" id="paramField">
      <label for="param" id="paramLabel">Value</label>
      <input type="number" id="param">
      <select id="paramSel"></select>
    </div>
    <div class="field grow" style="flex:1">
      <label>Examples</label>
      <div class="presets" id="presets"></div>
    </div>
    <label class="check" id="detailWrap"><input type="checkbox" id="detail" checked> Step inside rotations</label>
  </div>

  <div class="grid">
    <div class="card codecard">
      <div class="cardhead"><span>Code</span><span id="fnName"></span></div>
      <div class="code" id="code"></div>
      <div class="state">
        <div><h3>Call stack</h3><div class="stack" id="stack"></div></div>
        <div><h3>Variables</h3><div class="vars" id="vars"></div></div>
      </div>
    </div>

    <div class="card viz">
      <div class="msg"><span class="badge" id="lineBadge">—</span><div class="text" id="msg"></div></div>
      <div class="stage" id="stage">
        <svg id="tree" preserveAspectRatio="xMidYMid meet">
          <defs>
            <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z"/></marker>
            <marker id="arrHot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z"/></marker>
          </defs>
          <g id="gEdges"></g><g id="gNodes"></g><g id="gTags"></g>
        </svg>
      </div>
      <div class="legend" id="legend"></div>
      <div class="player">
        <button class="btn" id="bReset" title="Restart (Home)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
        <button class="btn" id="bPrev" title="Back (←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="btn primary" id="bPlay" title="Play / pause (Space)"></button>
        <button class="btn" id="bNext" title="Forward (→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
        <input type="range" id="scrub" min="0" max="0" value="0">
        <span class="count" id="count">0 / 0</span>
        <select id="speed" title="Speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2.5">2.5×</option></select>
        <button class="textbtn" id="bUse" title="Load the final tree as the new starting tree">Use result</button>
      </div>
    </div>
  </div>
  <div class="hint"><kbd>←</kbd> <kbd>→</kbd> step · <kbd>space</kbd> play · in rotate modes, click a node to rotate there</div>
</div>

<script>
(() => {
// ---------- code listings ----------
const CODE = {
  rotateRight: [
    "struct node *rotateRight(struct node *root) {",
    "    if (root == NULL || root->left == NULL) return root;",
    "    struct node *newRoot = root->left;",
    "    root->left = newRoot->right;",
    "    newRoot->right = root;",
    "    return newRoot;",
    "}"],
  rotateLeft: [
    "struct node *rotateLeft(struct node *root) {",
    "    if (root == NULL || root->right == NULL) return root;",
    "    struct node *newRoot = root->right;",
    "    root->right = newRoot->left;",
    "    newRoot->left = root;",
    "    return newRoot;",
    "}"],
  insertAtRoot: [
    "struct node *insertAtRoot(struct node *t, int v) {",
    "    if (t == NULL) {",
    "        return newNode(v);",
    "    } else if (v < t->item) {",
    "        t->left = insertAtRoot(t->left, v);",
    "        t = rotateRight(t);",
    "    } else if (v > t->item) {",
    "        t->right = insertAtRoot(t->right, v);",
    "        t = rotateLeft(t);",
    "    }",
    "    return t;",
    "}"],
  partition: [
    "struct node *partition(struct node *t, int i) {",
    "    int leftSize = size(t->left);",
    "    if (i < leftSize) {",
    "        t->left = partition(t->left, i);",
    "        t = rotateRight(t);",
    "    } else if (i > leftSize) {",
    "        t->right = partition(t->right, i - leftSize - 1);",
    "        t = rotateLeft(t);",
    "    }",
    "    return t;",
    "}"],
  rebalance: [
    "struct node *rebalance(struct node *t) {",
    "    if (size(t) < 3) return t;",
    "    t = partition(t, size(t) / 2);",
    "    t->left = rebalance(t->left);",
    "    t->right = rebalance(t->right);",
    "    return t;",
    "}"]
};
const MODES = {
  rotR:   {fns:['rotateRight'], label:'Rotate at', presets:[['Lecture','7 4 9 1 5'],['Bigger','20 10 30 5 15 25 35 12 17']]},
  rotL:   {fns:['rotateLeft'], label:'Rotate at', presets:[['Lecture','4 1 7 5 9'],['Bigger','20 10 30 5 15 25 35 22 28']]},
  insert: {fns:['insertAtRoot','rotateRight','rotateLeft'], label:'Insert value', def:24, presets:[['Lecture','10 5 14 30 29 32'],['Balanced','8 4 12 2 6 10 14'],['Empty','']]},
  part:   {fns:['partition','rotateRight','rotateLeft'], label:'Index i', def:3, presets:[['Lecture A','10 5 14 30 29 32'],['Lecture B','13 5 17 3 8 16 1 7 10'],['Chain','1 2 3 4 5 6 7']]},
  rebal:  {fns:['rebalance','partition','rotateRight','rotateLeft'], presets:[['Lecture','15 12 5 4 2 10 8'],['Chain','1 2 3 4 5 6 7'],['Zig-zag','1 9 2 8 3 7 4 6 5']]}
};

// ---------- state ----------
const $ = id => document.getElementById(id);
let mode = 'rotR', steps = [], cur = 0, playing = false, timer = null;
let meta = {};
const GX = 58, GY = 76, R = 19;

// ---------- helpers ----------
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function highlight(src){
  return esc(src).replace(/(\/\/.*$)|\b(struct|if|else|return|int)\b|\b(NULL)\b|\b(\d+)\b|\b([A-Za-z_]\w*)(?=\()/g,
    (m,c,kw,nul,num,fn) => c?`<span class="cm">${c}</span>`:kw?`<span class="kw">${kw}</span>`:nul?`<span class="num">${nul}</span>`:num?`<span class="num">${num}</span>`:`<span class="fn">${fn}</span>`);
}
function parseTree(){
  const nums = ($('treeInput').value.match(/-?\d+/g)||[]).map(Number);
  const H = {}; let root = null, k = 0;
  for(const v of nums){
    if(root==null){ root='n'+k; H[root]={v,l:null,r:null}; k++; continue; }
    let c = root;
    while(true){
      if(v===H[c].v) break;
      const s = v<H[c].v ? 'l':'r';
      if(H[c][s]==null){ const id='n'+k++; H[id]={v,l:null,r:null}; H[c][s]=id; break; }
      c = H[c][s];
    }
  }
  return {H, root, next:k};
}

// ---------- recorder ----------
let H, treeRoot, frames, detail, nextId;
const val = id => id==null ? 'NULL' : H[id].v;
const N = id => id==null ? '<code>NULL</code>' : `<span class="nv">${H[id].v}</span>`;
const size = id => id==null ? 0 : 1 + size(H[id].l) + size(H[id].r);
function subtree(id, cls, out={}){ if(id!=null){ out[id]=cls; subtree(H[id].l,cls,out); subtree(H[id].r,cls,out);} return out; }
function setVar(name, kind, value){
  const f = frames[frames.length-1]; const e = f.vars.find(x=>x[0]===name);
  if(e){ e[1]=kind; e[2]=value; } else f.vars.push([name,kind,value]);
}
function snap(line, msg, hl={}){
  const top = frames[frames.length-1]; top.line = line;
  const nodes = {};
  for(const id in H) nodes[id] = {v:H[id].v, l:H[id].l, r:H[id].r};
  steps.push({nodes, root:treeRoot, line, msg, hl:{...hl}, target: meta.target,
    stack: frames.map(f=>({fn:f.fn, line:f.line, label:f.label, vars:f.vars.map(x=>[...x])}))});
}
function pushFrame(fn, vars){
  const label = fn==='main' ? 'caller' : `${fn}(${vars.map(([n,k,v])=>`${n}=${k==='ptr'?val(v):v}`).join(', ')})`;
  frames.push({fn, vars, label, line:null});
}

function rotate(dir, r){
  const fn = dir==='R' ? 'rotateRight' : 'rotateLeft';
  const a = dir==='R' ? 'l':'r', b = dir==='R' ? 'r':'l';
  const A = dir==='R' ? 'left':'right', B = dir==='R' ? 'right':'left';
  if(!detail){
    if(r==null || H[r][a]==null) return r;
    const nr = H[r][a]; H[r][a] = H[nr][b]; H[nr][b] = r; return nr;
  }
  pushFrame(fn, [['root','ptr',r]]);
  snap(fn+':1', `Enter <code>${fn}</code> with <code>root</code> = ${N(r)}.`);
  if(r==null || H[r][a]==null){
    snap(fn+':2', `<code>root->${A}</code> is NULL, so there is nothing to lift up. Return <code>root</code> unchanged.`);
    frames.pop(); return r;
  }
  snap(fn+':2', `<code>root</code> = ${N(r)} and <code>root->${A}</code> = ${N(H[r][a])} both exist, so the rotation can go ahead.`);
  const nr = H[r][a]; setVar('newRoot','ptr',nr);
  snap(fn+':3', `<code>newRoot = root->${A}</code> → ${N(nr)}. This is the node that will move up.`);
  const mid = H[nr][b];
  H[r][a] = mid;
  const mv = mid!=null ? subtree(mid,'moved') : {};
  snap(fn+':4', mid==null
    ? `<code>newRoot->${B}</code> is NULL, so <code>root->${A}</code> becomes NULL.`
    : `The middle subtree ${N(mid)} (<code>newRoot->${B}</code>) changes parent: <code>root->${A}</code> now points to it.`, mv);
  H[nr][b] = r;
  snap(fn+':5', `<code>newRoot->${B} = root</code>. ${N(r)} is now the ${B} child of ${N(nr)}.`, mv);
  snap(fn+':6', `Return ${N(nr)} as the new root of this subtree. The caller still needs to store it.`);
  frames.pop(); return nr;
}

function insertAtRoot(t, v, par){
  pushFrame('insertAtRoot', [['t','ptr',t],['v','int',v]]);
  snap('insertAtRoot:1', `Call <code>insertAtRoot</code> with <code>t</code> = ${N(t)}, <code>v</code> = ${v}.`);
  if(t==null){
    snap('insertAtRoot:2', `<code>t</code> is NULL, we've walked off the bottom of the tree. This is where ${v} belongs.`);
    const id = 'n'+nextId++; H[id] = {v, l:null, r:null}; meta.target = id;
    meta.spawns[id] = par || null;
    snap('insertAtRoot:3', `Create a new node ${N(id)} and return it to the caller.`, {[id]:'new'});
    frames.pop(); return id;
  }
  snap('insertAtRoot:2', `<code>t</code> = ${N(t)}, not NULL.`);
  if(v < H[t].v){
    snap('insertAtRoot:4', `${v} &lt; ${H[t].v}, so ${v} belongs in the left subtree.`);
    snap('insertAtRoot:5', `Recurse: <code>insertAtRoot(t->left, ${v})</code>.`);
    const res = insertAtRoot(H[t].l, v, {id:t, side:'l'});
    H[t].l = res;
    snap('insertAtRoot:5', `Back at ${N(t)}: <code>t->left</code> = ${N(res)}. The new value is now t's left child.`);
    const nt = rotate('R', t); setVar('t','ptr',nt);
    snap('insertAtRoot:6', `<code>t = rotateRight(t)</code> lifts ${N(nt)} above ${N(t)}. <code>t</code> now points to ${N(nt)}.`);
    t = nt;
  } else {
    snap('insertAtRoot:4', `${v} is not less than ${H[t].v}.`);
    if(v > H[t].v){
      snap('insertAtRoot:7', `${v} &gt; ${H[t].v}, so ${v} belongs in the right subtree.`);
      snap('insertAtRoot:8', `Recurse: <code>insertAtRoot(t->right, ${v})</code>.`);
      const res = insertAtRoot(H[t].r, v, {id:t, side:'r'});
      H[t].r = res;
      snap('insertAtRoot:8', `Back at ${N(t)}: <code>t->right</code> = ${N(res)}. The new value is now t's right child.`);
      const nt = rotate('L', t); setVar('t','ptr',nt);
      snap('insertAtRoot:9', `<code>t = rotateLeft(t)</code> lifts ${N(nt)} above ${N(t)}. <code>t</code> now points to ${N(nt)}.`);
      t = nt;
    } else {
      snap('insertAtRoot:7', `${v} == ${H[t].v}, it's already in the tree. Nothing to insert.`);
    }
  }
  snap('insertAtRoot:11', `Return <code>t</code> = ${N(t)}.`);
  frames.pop(); return t;
}

function partition(t, i){
  pushFrame('partition', [['t','ptr',t],['i','int',i]]);
  snap('partition:1', `Call <code>partition</code> with <code>t</code> = ${N(t)}, <code>i</code> = ${i}: bring index ${i} of this subtree to its root.`);
  const ls = size(H[t].l); setVar('leftSize','int',ls);
  snap('partition:2', `<code>leftSize = size(t->left)</code> = ${ls}, so ${N(t)} itself sits at index ${ls} of this subtree.`, subtree(H[t].l,'count'));
  if(i < ls){
    snap('partition:3', `${i} &lt; ${ls}: the target is somewhere in the left subtree.`);
    snap('partition:4', `Recurse: <code>partition(t->left, ${i})</code>.`);
    const res = partition(H[t].l, i); H[t].l = res;
    snap('partition:4', `Back at ${N(t)}: <code>t->left</code> = ${N(res)}. The target is now t's left child.`);
    const nt = rotate('R', t); setVar('t','ptr',nt);
    snap('partition:5', `<code>t = rotateRight(t)</code> lifts ${N(nt)} up one level. <code>t</code> = ${N(nt)}.`);
    t = nt;
  } else {
    snap('partition:3', `${i} is not less than ${ls}.`);
    if(i > ls){
      snap('partition:6', `${i} &gt; ${ls}: the target is in the right subtree, at index ${i} − ${ls} − 1 = ${i-ls-1} there.`);
      snap('partition:7', `Recurse: <code>partition(t->right, ${i-ls-1})</code>.`);
      const res = partition(H[t].r, i-ls-1); H[t].r = res;
      snap('partition:7', `Back at ${N(t)}: <code>t->right</code> = ${N(res)}. The target is now t's right child.`);
      const nt = rotate('L', t); setVar('t','ptr',nt);
      snap('partition:8', `<code>t = rotateLeft(t)</code> lifts ${N(nt)} up one level. <code>t</code> = ${N(nt)}.`);
      t = nt;
    } else {
      snap('partition:6', `${i} == ${ls}: ${N(t)} is already the target. No rotation needed.`);
    }
  }
  snap('partition:10', `Return <code>t</code> = ${N(t)}.`);
  frames.pop(); return t;
}

function nth(t, i){ const ls = size(H[t].l); return i<ls ? nth(H[t].l,i) : i>ls ? nth(H[t].r,i-ls-1) : t; }

function rebalance(t){
  pushFrame('rebalance', [['t','ptr',t]]);
  snap('rebalance:1', `Call <code>rebalance</code> with <code>t</code> = ${N(t)}.`);
  const n = size(t);
  if(n < 3){
    snap('rebalance:2', `<code>size(t)</code> = ${n} &lt; 3, already as balanced as it can be. Return <code>t</code>.`, subtree(t,'count'));
    frames.pop(); return t;
  }
  snap('rebalance:2', `<code>size(t)</code> = ${n}, so this subtree needs balancing.`, subtree(t,'count'));
  const mid = Math.floor(n/2), med = nth(t, mid);
  meta.target = med;
  snap('rebalance:3', `Partition around the median: index ${n} / 2 = ${mid}, which is ${N(med)}.`);
  const nt = partition(t, mid); setVar('t','ptr',nt);
  snap('rebalance:3', `<code>t</code> = ${N(nt)}. The median is now the root of this subtree.`);
  meta.target = null;
  snap('rebalance:4', `Recurse into the left subtree.`);
  const L = rebalance(H[nt].l); H[nt].l = L;
  snap('rebalance:4', `Back at ${N(nt)}: <code>t->left</code> = ${N(L)}.`);
  snap('rebalance:5', `Recurse into the right subtree.`);
  const Rr = rebalance(H[nt].r); H[nt].r = Rr;
  snap('rebalance:5', `Back at ${N(nt)}: <code>t->right</code> = ${N(Rr)}.`);
  snap('rebalance:6', `Return <code>t</code> = ${N(nt)}.`);
  frames.pop(); return nt;
}

// ---------- build a run ----------
function build(){
  const T = parseTree(); H = T.H; treeRoot = T.root; nextId = T.next;
  steps = []; frames = []; meta = {spawns:{}, target:null, mainLine:'', parentOf:null};
  detail = $('detail').checked;
  const n = Object.keys(H).length;
  let main;

  if(mode==='rotR' || mode==='rotL'){
    const fn = mode==='rotR' ? 'rotateRight' : 'rotateLeft';
    let tgt = $('paramSel').value;
    if(!(tgt in H)) tgt = treeRoot;
    let parent = null, side = null;
    for(const id in H){ if(H[id].l===tgt){parent=id;side='l'} if(H[id].r===tgt){parent=id;side='r'} }
    const S = side==='l' ? 'left' : 'right';
    main = parent==null ? `tree = ${fn}(tree);` : `parent->${S} = ${fn}(parent->${S});`;
    meta.mainLine = main;
    pushFrame('main', parent==null ? [] : [['parent','ptr',parent]]);
    if(tgt==null){ snap('main:2','The tree is empty. Add some values above.'); }
    else {
      meta.target = null;
      snap('main:2', `Ready to call <code>${fn}</code> on ${N(tgt)}. Press play or → to step.`);
      const saved = detail; detail = true;
      const res = rotate(mode==='rotR'?'R':'L', tgt);
      detail = saved;
      if(parent==null) treeRoot = res; else H[parent][side] = res;
      snap('main:2', parent==null
        ? `The caller stores the result: <code>tree</code> = ${N(res)}. Done. Notice the in-order sequence never changed.`
        : `The caller stores the result: <code>parent->${S}</code> = ${N(res)}. Done. Notice the in-order sequence never changed.`);
    }
  } else if(mode==='insert'){
    let v = parseInt($('param').value,10); if(isNaN(v)) v = 0;
    main = `tree = insertAtRoot(tree, ${v});`; meta.mainLine = main;
    pushFrame('main', []);
    snap('main:2', `Ready to insert ${v} at the root. It goes in at a leaf first, then rotates up on the way back out of the recursion.`);
    const res = insertAtRoot(treeRoot, v, null);
    treeRoot = res;
    snap('main:2', `<code>tree</code> = ${N(res)}. ${v} is now the root of the whole tree.`);
  } else if(mode==='part'){
    let i = parseInt($('param').value,10); if(isNaN(i)) i = 0;
    i = Math.max(0, Math.min(n-1, i)); $('param').value = n ? i : 0;
    main = `tree = partition(tree, ${i});`; meta.mainLine = main;
    pushFrame('main', []);
    if(!n){ snap('main:2','The tree is empty. Add some values above.'); }
    else {
      meta.target = nth(treeRoot, i);
      snap('main:2', `Index ${i} (in-order) is ${N(meta.target)}, marked with the dashed ring. Watch it climb to the root.`);
      const res = partition(treeRoot, i); treeRoot = res;
      snap('main:2', `<code>tree</code> = ${N(res)}. Index ${i} is now the root.`);
    }
  } else {
    main = `tree = rebalance(tree);`; meta.mainLine = main;
    pushFrame('main', []);
    snap('main:2', `Ready to rebalance: repeatedly lift each subtree's median to its root.`);
    const res = rebalance(treeRoot); treeRoot = res;
    snap('main:2', `<code>tree</code> = ${N(res)}. The tree is now size-balanced.`);
  }
  computeLayouts();
  renderCode();
  resetView();
  show(0, true);
}

// ---------- layout ----------
function layout(s){
  const pos = {}, idx = {}, seen = new Set(); let i = 0, ok = true;
  (function go(id, d){
    if(id==null || !ok) return;
    if(seen.has(id)){ ok=false; return; }
    seen.add(id);
    go(s.nodes[id].l, d+1);
    pos[id] = {x:i*GX, y:d*GY}; idx[id] = i++;
    go(s.nodes[id].r, d+1);
  })(s.root, 0);
  if(!ok || seen.size !== Object.keys(s.nodes).length) return null;
  return {pos, idx};
}
function computeLayouts(){
  let prevPos = {}, prevIdx = {};
  for(const s of steps){
    const lay = layout(s);
    if(lay){ s.pos = lay.pos; s.idx = lay.idx; }
    else {
      s.pos = {}; s.idx = {};
      for(const id in s.nodes){
        if(prevPos[id]){ s.pos[id] = prevPos[id]; if(id in prevIdx) s.idx[id] = prevIdx[id]; }
        else {
          const sp = meta.spawns[id];
          s.pos[id] = sp && prevPos[sp.id] ? {x: prevPos[sp.id].x + (sp.side==='l'?-0.6:0.6)*GX, y: prevPos[sp.id].y + GY} : {x:0, y:0};
        }
      }
    }
    prevPos = s.pos; prevIdx = s.idx;
  }
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const s of steps) for(const id in s.pos){ const p=s.pos[id]; x0=Math.min(x0,p.x); x1=Math.max(x1,p.x); y0=Math.min(y0,p.y); y1=Math.max(y1,p.y); }
  if(!isFinite(x0)){ x0=0;x1=0;y0=0;y1=0; }
  const minW = 6*GX; if(x1-x0 < minW){ const c=(x0+x1)/2; x0=c-minW/2; x1=c+minW/2; }
  const minH = 3*GY; if(y1-y0 < minH){ y1 = y0 + minH; }
  $('tree').setAttribute('viewBox', `${x0-44} ${y0-58} ${x1-x0+88} ${y1-y0+58+46}`);
}

// ---------- code panel ----------
function renderCode(){
  const fns = MODES[mode].fns;
  let html = `<div class="fnblock" data-fn="main"><div class="ln"><span class="no"></span><span>${highlight('// caller')}</span></div><div class="ln" data-id="main:2"><span class="no"></span><span>${highlight(meta.mainLine)}</span></div></div>`;
  for(const fn of fns){
    html += `<div class="fnblock" data-fn="${fn}">` + CODE[fn].map((l,i)=>`<div class="ln" data-id="${fn}:${i+1}"><span class="no">${i+1}</span><span>${highlight(l)}</span></div>`).join('') + `</div>`;
  }
  $('code').innerHTML = html;
}

// ---------- svg rendering ----------
const SVGNS = 'http://www.w3.org/2000/svg';
const mk = (tag, attrs={}, parent) => { const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; };
let NV = {}, EV = {}, TV = {};
let dur = 600;
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function nodePos(id, now){
  const d = NV[id]; if(!d) return {x:0,y:0};
  const p = ease(Math.min(1, Math.max(0,(now-d.t0)/dur)));
  return {x: d.fx + (d.tx-d.fx)*p, y: d.fy + (d.ty-d.fy)*p};
}
function edgeEnd(key, now){
  const e = EV[key]; const tp = nodePos(e.to, now);
  if(e.direct) return tp;
  const p = ease(Math.min(1, Math.max(0,(now-e.t0)/dur)));
  return {x: e.fx + (tp.x-e.fx)*p, y: e.fy + (tp.y-e.fy)*p};
}
function resetView(){
  $('gEdges').innerHTML=''; $('gNodes').innerHTML=''; $('gTags').innerHTML='';
  NV={}; EV={}; TV={};
}
function show(k, instant){
  k = Math.max(0, Math.min(steps.length-1, k));
  const s = steps[k], prev = steps[k-1];
  const now = performance.now();
  const sp = +$('speed').value; dur = instant ? 0 : Math.max(220, 620/sp);
  cur = k;

  // nodes
  for(const id in NV){ if(!(id in s.nodes)){ NV[id].g.remove(); delete NV[id]; } }
  const top = s.stack[s.stack.length-1];
  const auto = {};
  for(const [name,kind,v] of top.vars){ if(kind==='ptr' && v!=null){ if(name==='newRoot') auto[v]='new'; else if(name==='t'||name==='root') auto[v] = auto[v]||'cur'; } }
  for(const id in s.nodes){
    let d = NV[id]; const to = s.pos[id];
    if(!d){
      const g = mk('g',{class:'node'}, $('gNodes'));
      mk('circle',{class:'ring',r:R+5},g); mk('circle',{class:'body',r:R},g);
      const t = mk('text',{class:'val'},g); t.textContent = s.nodes[id].v;
      const ix = mk('text',{class:'idx',y:R+16}, g);
      g.addEventListener('click', ()=>onNodeClick(id));
      d = NV[id] = {g, ix, fx:to.x, fy:to.y, tx:to.x, ty:to.y, t0:now};
    } else {
      const c = nodePos(id, now);
      Object.assign(d, {fx:c.x, fy:c.y, tx:to.x, ty:to.y, t0:now});
    }
    const cls = s.hl[id] || auto[id] || '';
    d.g.setAttribute('class', 'node ' + cls + (s.target===id ? ' target':''));
    const showIdx = (mode==='part'||mode==='rebal') && (id in s.idx);
    d.ix.textContent = showIdx ? `[${s.idx[id]}]` : '';
  }

  // edges
  const live = new Set();
  for(const id in s.nodes){
    for(const side of ['l','r']){
      const c = s.nodes[id][side]; const key = id+side;
      if(c==null) continue;
      live.add(key);
      let e = EV[key];
      if(!e){
        const el = mk('path',{class:'edge'}, $('gEdges'));
        const ps = nodePos(id, now);
        const ct = s.pos[c];
        e = EV[key] = {el, from:id, to:c, fx: instant?ct.x:ps.x, fy: instant?ct.y:ps.y, t0:now, direct:!!instant};
      } else if(e.to!==c){
        const ep = edgeEnd(key, now);
        Object.assign(e, {to:c, fx:ep.x, fy:ep.y, t0:now, direct:false});
      } else if(!e.direct && now - e.t0 >= dur){ e.direct = true; }
      const hot = prev && prev.nodes[id] && prev.nodes[id][side]!==c;
      const hotNew = prev && !prev.nodes[id];
      e.el.setAttribute('class', 'edge' + ((hot||hotNew) ? ' hot':''));
    }
  }
  for(const key in EV){ if(!live.has(key)){ EV[key].el.remove(); delete EV[key]; } }

  // tags
  const labels = {};
  const add = (id,name,cls) => { if(id==null || !(id in s.nodes)) return; (labels[id] = labels[id]||[]).push([name,cls]); };
  for(const [name,kind,v] of top.vars) if(kind==='ptr') add(v, name, name==='newRoot'?'violet':'');
  if(s.root!=null) add(s.root, 'tree', 'muted');
  for(const id in TV){ TV[id].g.remove(); delete TV[id]; }
  for(const id in labels){
    const list = labels[id];
    const hasVar = list.some(x=>x[1]!=='muted');
    const cls = list.some(x=>x[1]==='violet') && list.every(x=>x[1]!=='') ? 'violet' : hasVar ? '' : 'muted';
    const text = list.map(x=>x[0]).join(' · ');
    const g = mk('g',{class:'tag '+cls}, $('gTags'));
    const w = text.length*6.9 + 14;
    mk('rect',{x:-w/2, y:-10, width:w, height:20, rx:7}, g);
    const t = mk('text',{}, g); t.textContent = text;
    TV[id] = {g};
  }

  // panels
  updatePanels(s);
  $('scrub').max = steps.length-1; $('scrub').value = k;
  $('count').textContent = `${k+1} / ${steps.length}`;
  if(k>=steps.length-1 && playing) stop();
  requestAnimationFrame(frame);
}
let rafOn = false;
function frame(){
  const now = performance.now();
  for(const id in NV){
    const p = nodePos(id, now);
    NV[id].g.setAttribute('transform', `translate(${p.x},${p.y})`);
    if(TV[id]) TV[id].g.setAttribute('transform', `translate(${p.x},${p.y-R-17})`);
  }
  for(const key in EV){
    const e = EV[key];
    const a = nodePos(e.from, now), b = edgeEnd(key, now);
    const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy);
    if(L < 2*R+8){ e.el.setAttribute('d',''); continue; }
    const ux=dx/L, uy=dy/L;
    const sx=a.x+ux*R, sy=a.y+uy*R, ex=b.x-ux*(R+4), ey=b.y-uy*(R+4);
    e.el.setAttribute('d', `M${sx.toFixed(1)},${sy.toFixed(1)} L${ex.toFixed(1)},${ey.toFixed(1)}`);
  }
  let busy = false;
  for(const id in NV) if(now - NV[id].t0 < dur) busy = true;
  for(const key in EV) if(now - EV[key].t0 < dur) busy = true;
  if(busy) requestAnimationFrame(frame);
}

function updatePanels(s){
  $('msg').innerHTML = s.msg;
  const fnName = s.line.split(':')[0];
  $('lineBadge').textContent = fnName==='main' ? 'caller' : `line ${s.line.split(':')[1]}`;
  $('fnName').textContent = fnName==='main' ? '' : fnName + '()';
  // code highlight
  const code = $('code');
  code.querySelectorAll('.ln.active,.ln.caller').forEach(e=>e.classList.remove('active','caller'));
  const activeFns = new Set(s.stack.map(f=>f.fn));
  code.querySelectorAll('.fnblock').forEach(b=>b.classList.toggle('dim', !activeFns.has(b.dataset.fn)));
  s.stack.forEach((f,i)=>{
    if(!f.line) return;
    const el = code.querySelector(`[data-id="${f.line}"]`);
    if(el) el.classList.add(i===s.stack.length-1 ? 'active':'caller');
  });
  const act = code.querySelector('.ln.active');
  if(act){
    const top = act.offsetTop - code.offsetTop, h = code.clientHeight;
    if(top < code.scrollTop + 20 || top > code.scrollTop + h - 40) code.scrollTo({top: Math.max(0, top - h/3), behavior:'smooth'});
  }
  // stack
  $('stack').innerHTML = s.stack.map((f,i)=>`<div class="${i===s.stack.length-1?'top':''}" title="${esc(f.label)}">${esc(f.label)}</div>`).join('');
  // vars
  const top = s.stack[s.stack.length-1];
  const vv = top.vars.map(([n,k,v])=>{
    const isNull = k==='ptr' && v==null;
    const shown = k==='ptr' ? (v==null ? 'NULL' : `→ ${s.nodes[v].v}`) : v;
    return `<span class="k">${n}</span><span class="v ${isNull?'null':''}">${shown}</span>`;
  });
  vv.push(`<span class="k">tree</span><span class="v ${s.root==null?'null':''}">${s.root==null?'NULL':'→ '+s.nodes[s.root].v}</span>`);
  $('vars').innerHTML = vv.join('');
}

// ---------- playback ----------
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
function play(){
  if(cur >= steps.length-1) show(0);
  playing = true; $('bPlay').innerHTML = ICON_PAUSE; tick();
}
function tick(){
  clearTimeout(timer);
  if(!playing) return;
  timer = setTimeout(()=>{ if(!playing) return; if(cur < steps.length-1){ show(cur+1); tick(); } else stop(); }, 1350 / +$('speed').value);
}
function stop(){ playing = false; clearTimeout(timer); $('bPlay').innerHTML = ICON_PLAY; }
$('bPlay').innerHTML = ICON_PLAY;
$('bPlay').onclick = () => playing ? stop() : play();
$('bNext').onclick = () => { stop(); show(cur+1); };
$('bPrev').onclick = () => { stop(); show(cur-1); };
$('bReset').onclick = () => { stop(); show(0); };
$('scrub').oninput = e => { stop(); show(+e.target.value); };
$('speed').onchange = () => { if(playing) tick(); };
document.addEventListener('keydown', e => {
  if(e.target.matches('input[type=text],input[type=number],select')) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); stop(); show(cur+1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); stop(); show(cur-1); }
  else if(e.key===' '){ e.preventDefault(); playing ? stop() : play(); }
  else if(e.key==='Home'){ stop(); show(0); }
});

// ---------- setup controls ----------
function preorder(s){ const out=[]; (function go(id){ if(id==null) return; out.push(s.nodes[id].v); go(s.nodes[id].l); go(s.nodes[id].r); })(s.root); return out; }
$('bUse').onclick = () => { const s = steps[steps.length-1]; $('treeInput').value = preorder(s).join(' '); refreshParam(); stop(); build(); };

function refreshParam(){
  const M = MODES[mode];
  const rot = mode==='rotR' || mode==='rotL';
  $('paramField').style.display = M.label ? '' : 'none';
  $('paramLabel').textContent = M.label || '';
  $('param').style.display = rot ? 'none' : '';
  $('paramSel').style.display = rot ? '' : 'none';
  $('detailWrap').style.display = rot ? 'none' : '';
  if(rot){
    const T = parseTree(); const keep = $('paramSel').value;
    const ids = Object.keys(T.H).sort((a,b)=>T.H[a].v-T.H[b].v);
    $('paramSel').innerHTML = ids.map(id=>`<option value="${id}">${T.H[id].v}${id===T.root?' (root)':''}</option>`).join('');
    $('paramSel').value = (keep in T.H) ? keep : (T.root || '');
  }
}
function setMode(m, loadPreset=true){
  stop(); mode = m;
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on', b.dataset.mode===m));
  document.body.className = 'mode-'+m;
  const M = MODES[m];
  $('presets').innerHTML = M.presets.map(([n,v],i)=>`<button class="chipbtn" data-i="${i}">${n}${v?`: ${v}`:''}</button>`).join('');
  $('presets').querySelectorAll('button').forEach(b=>b.onclick=()=>{ $('treeInput').value = M.presets[b.dataset.i][1]; $('paramSel').value=''; refreshParam(); build(); });
  if(loadPreset){ $('treeInput').value = M.presets[0][1]; $('paramSel').value = ''; }
  if(M.def!=null) $('param').value = M.def;
  refreshParam();
  const items = {
    rotR:[['cur','root'],['new','newRoot'],['moved','subtree that changes parent']],
    rotL:[['cur','root'],['new','newRoot'],['moved','subtree that changes parent']],
    insert:[['cur','t / root'],['new','new node · newRoot'],['moved','subtree that changes parent']],
    part:[['cur','t / root'],['new','newRoot'],['count','counted by size()'],['target','target index']],
    rebal:[['cur','t / root'],['new','newRoot'],['count','counted by size()'],['target','median']]
  }[m];
  const col = {cur:'var(--accent)',new:'var(--violet)',moved:'var(--amber)',count:'var(--teal)',target:'var(--rose)'};
  const bg = {cur:'var(--accent-soft)',new:'var(--violet-soft)',moved:'var(--amber-soft)',count:'var(--teal-soft)',target:'transparent'};
  $('legend').innerHTML = items.map(([c,t])=>`<span><i style="border-color:${col[c]};background:${bg[c]};${c==='target'?'border-style:dashed':''}"></i>${t}</span>`).join('')
    + `<span><i style="border-radius:2px;height:3px;width:16px;border:0;background:var(--accent)"></i>pointer just changed</span>`;
  build();
}
function onNodeClick(id){
  if(mode!=='rotR' && mode!=='rotL') return;
  const T = parseTree(); if(!(id in T.H)) return;
  $('paramSel').value = id; build();
}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
let deb;
$('treeInput').addEventListener('input', ()=>{ clearTimeout(deb); deb=setTimeout(()=>{ stop(); refreshParam(); build(); }, 350); });
$('param').addEventListener('input', ()=>{ clearTimeout(deb); deb=setTimeout(()=>{ stop(); build(); }, 350); });
$('paramSel').addEventListener('change', ()=>{ stop(); build(); });
$('detail').addEventListener('change', ()=>{ stop(); build(); });

setMode('rotR');
})();
</script>
</body>
</html>
