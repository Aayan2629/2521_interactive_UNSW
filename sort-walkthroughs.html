<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COMP2521 Sort Walkthroughs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Styled to match the COMP2521 Beamer slides: yellow sidebar, orange
   title bar, boxed array cells, pointer tags, code with the current
   line in red. Fira fonts are what the lecture slides use.
   ===================================================================== */
:root {
  --bg: #FFFFFF;
  --ink: #111111;
  --muted: #6A6A6A;
  --side: #FFD24D;        /* lecture sidebar yellow */
  --side-ink: #7A5A00;
  --bar: #FFBF00;         /* lecture title bar */
  --tag: #E6E6E6;         /* grey pointer tags (lo, hi, i, j) */
  --cell-line: #111111;
  --sorted: #FFF3C4;      /* soft fill for the already-sorted part */
  --cmp: #CFE3FF;         /* cells being compared */
  --moved: #FFD9D9;       /* cells just written/swapped */
  --cur: #E0301E;         /* current code line (red, like the slides) */
  --kw: #2E8B00;          /* for / if / break (green in slides) */
  --type: #2F4FE0;        /* int / Item / void (blue in slides) */
  --btn: #111111; --btn-ink: #FFFFFF;
  --mono: "Fira Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: "Fira Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16161A; --ink: #EDEDED; --muted: #A0A0A8; --side: #3A2F0C; --side-ink: #FFD24D;
    --bar: #B88700; --tag: #34343C; --cell-line: #EDEDED; --sorted: #3A3314; --cmp: #1E3558;
    --moved: #4A2226; --cur: #FF6B5C; --kw: #7BD34A; --type: #8FA4FF; --btn: #EDEDED; --btn-ink: #16161A;
  }
}
:root[data-theme="dark"] {
  --bg: #16161A; --ink: #EDEDED; --muted: #A0A0A8; --side: #3A2F0C; --side-ink: #FFD24D;
  --bar: #B88700; --tag: #34343C; --cell-line: #EDEDED; --sorted: #3A3314; --cmp: #1E3558;
  --moved: #4A2226; --cur: #FF6B5C; --kw: #7BD34A; --type: #8FA4FF; --btn: #EDEDED; --btn-ink: #16161A;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 400 1rem/1.5 var(--sans); }
button, input { font: inherit; }
:focus-visible { outline: 3px solid var(--type); outline-offset: 2px; }

/* ---------- Slide-like frame: sidebar + main ---------- */
.frame { display: grid; grid-template-columns: 11rem minmax(0, 1fr); min-height: 100vh; }
@media (max-width: 760px) { .frame { grid-template-columns: 1fr; } }

.side { background: var(--side); color: var(--side-ink); padding: 1.1rem .9rem; }
.side .course { font-weight: 600; text-align: center; font-size: .9rem; line-height: 1.2; margin-bottom: 1.5rem; }
.side nav { display: flex; flex-direction: column; gap: .2rem; }
.side nav button {
  text-align: left; border: 0; background: transparent; color: var(--side-ink);
  padding: .45rem .6rem; border-radius: 6px; cursor: pointer; font-size: .95rem;
}
.side nav button[aria-selected="true"] { background: rgba(255,255,255,.55); color: var(--ink); font-weight: 600; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .side nav button[aria-selected="true"] { background: rgba(255,210,77,.18); color: var(--side-ink); } }
@media (max-width: 760px) {
  .side { padding: .6rem .8rem; display: flex; align-items: center; gap: 1rem; overflow-x: auto; }
  .side .course { margin: 0; flex: none; }
  .side nav { flex-direction: row; }
  .side nav button { white-space: nowrap; }
}

.main { display: flex; flex-direction: column; min-width: 0; }
.bar { background: var(--bar); color: #fff; font-size: clamp(1.3rem, 3vw, 1.75rem); text-align: right; padding: .55rem 1.3rem; }

.stage { padding: 1.6rem 1.3rem 2rem; max-width: 60rem; width: 100%; margin: 0 auto; }

/* ---------- The array visual (matches the slides) ---------- */
.viz { overflow-x: auto; padding-bottom: .5rem; }
.viz-inner { display: flex; align-items: flex-start; justify-content: center; gap: 2rem; min-width: max-content; margin: 0 auto; }
.arr { display: grid; grid-auto-flow: column; grid-auto-columns: 3.1rem; }
.col { display: flex; flex-direction: column; align-items: stretch; }
.idx { font-family: var(--mono); text-align: center; height: 1.6rem; color: var(--ink); }
.top-tags, .bot-tags { display: flex; flex-direction: column; min-height: 1.6rem; }
.bot-tags { min-height: 3.2rem; }
.tag {
  font-family: var(--mono); background: var(--tag); border: 1.5px solid var(--cell-line);
  text-align: center; height: 1.6rem; line-height: 1.45rem; font-size: .92rem;
}
.bot-tags .tag + .tag { border-top: 0; }
.top-tags .tag { border-bottom: 0; }
.cell {
  font-family: var(--sans); font-size: 1.55rem; text-align: center; height: 3.1rem; line-height: 3rem;
  border: 1.5px solid var(--cell-line); border-left-width: 0; background: var(--bg);
  transition: background-color .2s;
}
.col:first-child .cell { border-left-width: 1.5px; }
.cell.sorted { background: var(--sorted); }
.cell.cmp { background: var(--cmp); }
.cell.moved { background: var(--moved); }

/* Side variables (item, swapped, min...) boxed like "item" on the slide */
.vars { display: flex; flex-direction: column; gap: .5rem; padding-top: 3.2rem; }
.var { display: flex; align-items: center; gap: .55rem; font-family: var(--mono); }
.var .box { min-width: 3.1rem; height: 3.1rem; border: 1.5px solid var(--cell-line); display: grid; place-items: center; font-family: var(--sans); font-size: 1.35rem; padding: 0 .4rem; }
.var.small .box { height: 2.2rem; min-width: 2.2rem; font-size: 1rem; }

/* ---------- Plain-English caption ---------- */
.caption {
  margin: 1.2rem auto 0; max-width: 42rem; text-align: center; min-height: 3rem; color: var(--ink);
}
.caption b { font-weight: 600; }

/* ---------- Code (current line red, like the slides) ---------- */
pre.code {
  font-family: var(--mono); font-size: clamp(.8rem, 1.9vw, 1.02rem); line-height: 1.55;
  margin: 1.4rem 0 0; padding: .2rem 0; overflow-x: auto; background: transparent;
}
.ln { display: block; padding: 0 .6rem; border-left: 3px solid transparent; white-space: pre; }
.ln.cur { color: var(--cur); border-left-color: var(--cur); }
.ln.cur .t, .ln.cur .k { color: var(--cur); }
.t { color: var(--type); }
.k { color: var(--kw); }

/* ---------- Controls ---------- */
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; margin-top: 1.5rem; }
.ctl { border: 1.5px solid var(--ink); background: var(--bg); color: var(--ink); border-radius: 8px; padding: .45rem .8rem; cursor: pointer; }
.ctl.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); min-width: 6.5rem; }
.ctl:disabled { opacity: .35; cursor: default; }
.scrub { flex: 1 1 12rem; accent-color: var(--bar); }
.count { font-family: var(--mono); color: var(--muted); font-size: .9rem; min-width: 6.5rem; text-align: right; }

.setup { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; margin-top: 1rem; color: var(--muted); font-size: .92rem; }
.setup input { font-family: var(--mono); border: 1.5px solid var(--tag); background: var(--bg); color: var(--ink); border-radius: 8px; padding: .4rem .6rem; width: 13rem; }
.stats { font-family: var(--mono); color: var(--muted); font-size: .9rem; margin-top: .8rem; }
.legend { display: flex; flex-wrap: wrap; gap: 1rem; font-size: .85rem; color: var(--muted); margin-top: .6rem; }
.legend span::before { content: ""; display: inline-block; width: .9rem; height: .9rem; border: 1px solid var(--cell-line); vertical-align: -2px; margin-right: .35rem; background: var(--sw); }
</style>
</head>
<body>
<div class="frame">
  <aside class="side">
    <div class="course">COMP2521<br>26T3</div>
    <nav role="tablist" aria-label="Choose a sort" id="tabs"></nav>
  </aside>

  <div class="main">
    <div class="bar" id="title">Selection Sort Walkthrough</div>
    <div class="stage">
      <div class="viz"><div class="viz-inner" id="viz"></div></div>
      <p class="caption" id="caption" aria-live="polite"></p>
      <pre class="code" id="code"></pre>

      <div class="controls">
        <button class="ctl" id="first" aria-label="Go to start">⏮</button>
        <button class="ctl" id="prev" aria-label="Previous step">◀</button>
        <button class="ctl primary" id="play">▶ Play</button>
        <button class="ctl" id="next" aria-label="Next step">▶</button>
        <button class="ctl" id="last" aria-label="Go to end">⏭</button>
        <input type="range" class="scrub" id="scrub" min="0" value="0" aria-label="Step">
        <span class="count" id="count"></span>
      </div>
      <div class="stats" id="stats"></div>
      <div class="legend">
        <span style="--sw: var(--cmp)">being compared</span>
        <span style="--sw: var(--moved)">just changed</span>
        <span style="--sw: var(--sorted)">sorted so far</span>
      </div>

      <div class="setup">
        <label for="arrIn">Array</label>
        <input id="arrIn" value="4 2 1 5 3" inputmode="numeric">
        <button class="ctl" id="apply">Use this array</button>
        <button class="ctl" id="rand">Random</button>
        <span>Arrow keys step, space plays</span>
      </div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   HOW IT WORKS
   Each sort is "run" once up front and every tiny step is recorded as a
   snapshot (array, pointer positions, current code line, caption).
   The buttons just move through that list of snapshots.
   Same idea as printing the state inside your C loop at every line.
   ===================================================================== */

// ---------- The C code for each sort, exactly as in the lecture ----------
const CODE = {
  selection: [
    "void selectionSort(Item items[], int lo, int hi) {",
    "    for (int i = lo; i < hi; i++) {",
    "        int min = i;",
    "        for (int j = i + 1; j <= hi; j++) {",
    "            if (lt(items[j], items[min])) {",
    "                min = j;",
    "            }",
    "        }",
    "        swap(items, i, min);",
    "    }",
    "}",
  ],
  bubble: [
    "void bubbleSort(Item items[], int lo, int hi) {",
    "    for (int i = hi; i > lo; i--) {",
    "        bool swapped = false;",
    "        for (int j = lo; j < i; j++) {",
    "            if (gt(items[j], items[j + 1])) {",
    "                swap(items, j, j + 1);",
    "                swapped = true;",
    "            }",
    "        }",
    "        if (!swapped) break;",
    "    }",
    "}",
  ],
  insertion: [
    "void insertionSort(Item items[], int lo, int hi) {",
    "    for (int i = lo + 1; i <= hi; i++) {",
    "        Item item = items[i];",
    "        int j = i;",
    "        for (; j > lo && lt(item, items[j - 1]); j--) {",
    "            items[j] = items[j - 1];",
    "        }",
    "        items[j] = item;",
    "    }",
    "}",
  ],
};
const TITLES = { selection: "Selection Sort", bubble: "Bubble Sort", insertion: "Insertion Sort" };

/* ---------- Tracers ----------
   Each function runs the real algorithm and calls snap() at every line.
   snap(line, caption, extras) records a copy of the current state.
   extras: ptr = {name: index} for tags under cells, vars = side boxes,
           cmp = indices being compared, moved = indices just written,
           sorted = indices known to be in final place.            */

function makeRecorder(a) {
  const steps = [];
  const stats = { cmp: 0, swaps: 0 };
  const snap = (line, caption, ex = {}) => steps.push({
    arr: a.slice(), line, caption,
    ptr: ex.ptr || {}, vars: ex.vars || [], cmp: ex.cmp || [], moved: ex.moved || [],
    sorted: ex.sorted || [], stats: { ...stats },
  });
  return { steps, stats, snap };
}
const range = (from, to) => { const r = []; for (let k = from; k <= to; k++) r.push(k); return r; };

function traceSelection(input) {
  const a = input.slice(), lo = 0, hi = a.length - 1;
  const { steps, stats, snap } = makeRecorder(a);
  snap(0, "Start: <b>lo</b> is the first index, <b>hi</b> is the last.");
  let i;
  for (i = lo; i < hi; i++) {
    const sorted = range(lo, i - 1);
    snap(1, `<b>i = ${i}</b>. Everything left of i is already in its final place.`, { ptr: { i }, sorted });
    let min = i;
    snap(2, `Assume the smallest so far is at i, so <b>min = ${min}</b> (value ${a[min]}).`, { ptr: { i, min }, sorted });
    let j;
    for (j = i + 1; j <= hi; j++) {
      snap(3, `<b>j = ${j}</b>: scan the rest of the array for something smaller.`, { ptr: { i, min, j }, sorted });
      stats.cmp++;
      const smaller = a[j] < a[min];
      snap(4, `Is ${a[j]} &lt; ${a[min]}? <b>${smaller ? "Yes" : "No"}</b>.`, { ptr: { i, min, j }, cmp: [j, min], sorted });
      if (smaller) {
        min = j;
        snap(5, `New smallest found, so <b>min = ${min}</b>.`, { ptr: { i, min, j }, sorted });
      }
    }
    snap(3, `j = ${j} is past hi, so the scan ends. Smallest remaining value is ${a[min]}.`, { ptr: { i, min }, sorted });
    [a[i], a[min]] = [a[min], a[i]];
    stats.swaps++;
    snap(8, i === min ? `min equals i, so ${a[i]} swaps with itself (still counts as a swap).`
                      : `Swap items[${i}] and items[${min}]. ${a[i]} is now in its final place.`,
         { ptr: { i, min }, moved: [i, min], sorted });
  }
  snap(1, `i = ${i} is not &lt; hi, so the loop ends.`, { sorted: range(lo, hi) });
  snap(10, "Done. The array is sorted.", { sorted: range(lo, hi) });
  return steps;
}

function traceBubble(input) {
  const a = input.slice(), lo = 0, hi = a.length - 1;
  const { steps, stats, snap } = makeRecorder(a);
  snap(0, "Start: <b>lo</b> is the first index, <b>hi</b> is the last.");
  let i, finishedEarly = false;
  for (i = hi; i > lo; i--) {
    const sorted = range(i + 1, hi);
    snap(1, `<b>i = ${i}</b>. This pass bubbles the largest remaining value up to index ${i}.`, { ptr: { i }, sorted });
    let swapped = false;
    const sv = () => [{ name: "swapped", val: String(swapped), small: true }];
    snap(2, "No swaps yet this pass, so <b>swapped = false</b>.", { ptr: { i }, vars: sv(), sorted });
    let j;
    for (j = lo; j < i; j++) {
      snap(3, `<b>j = ${j}</b>: look at the pair items[${j}] and items[${j + 1}].`, { ptr: { i, j, "j+1": j + 1 }, vars: sv(), sorted });
      stats.cmp++;
      const out = a[j] > a[j + 1];
      snap(4, `Is ${a[j]} &gt; ${a[j + 1]}? <b>${out ? "Yes, they're out of order" : "No, leave them"}</b>.`,
           { ptr: { i, j, "j+1": j + 1 }, vars: sv(), cmp: [j, j + 1], sorted });
      if (out) {
        [a[j], a[j + 1]] = [a[j + 1], a[j]];
        stats.swaps++;
        snap(5, `Swap them.`, { ptr: { i, j, "j+1": j + 1 }, vars: sv(), moved: [j, j + 1], sorted });
        swapped = true;
        snap(6, "Remember that a swap happened: <b>swapped = true</b>.", { ptr: { i, j, "j+1": j + 1 }, vars: sv(), sorted });
      }
    }
    const sortedAfter = range(i, hi);
    snap(3, `j = ${j} is not &lt; i, so the pass ends. ${a[i]} is now in its final place.`, { ptr: { i }, vars: sv(), sorted: sortedAfter });
    snap(9, swapped ? "There was a swap, so keep going." : "No swaps this pass, so the array is already sorted. <b>break</b>.",
         { ptr: { i }, vars: sv(), sorted: swapped ? sortedAfter : range(lo, hi) });
    if (!swapped) { finishedEarly = true; break; }
  }
  if (!finishedEarly) snap(1, `i = ${i} is not &gt; lo, so the loop ends.`, { sorted: range(lo, hi) });
  snap(11, "Done. The array is sorted.", { sorted: range(lo, hi) });
  return steps;
}

function traceInsertion(input) {
  const a = input.slice(), lo = 0, hi = a.length - 1;
  const { steps, stats, snap } = makeRecorder(a);
  snap(0, "Start: <b>lo</b> is the first index, <b>hi</b> is the last.");
  let i;
  for (i = lo + 1; i <= hi; i++) {
    const sorted = range(lo, i - 1);   // sorted relative to each other, not final
    snap(1, `<b>i = ${i}</b>. items[lo..${i - 1}] are sorted among themselves.`, { ptr: { i }, sorted });
    const item = a[i];
    const iv = () => [{ name: "item", val: item }];
    snap(2, `Copy the value to insert: <b>item = ${item}</b>.`, { ptr: { i }, vars: iv(), sorted });
    let j = i;
    snap(3, `<b>j = ${j}</b>. j marks the gap where item might go.`, { ptr: { i, j }, vars: iv(), sorted });
    while (true) {
      if (j > lo) stats.cmp++;
      const go = j > lo && item < a[j - 1];
      const why = j <= lo ? `j is at lo, so stop.` : `Is ${item} &lt; items[${j - 1}] = ${a[j - 1]}? <b>${go ? "Yes, shift it right" : "No, stop here"}</b>.`;
      snap(4, why, { ptr: { i, j }, vars: iv(), cmp: j > lo ? [j - 1] : [], sorted });
      if (!go) break;
      a[j] = a[j - 1];
      stats.swaps++;  // counted as a move/shift
      snap(5, `Shift: items[${j}] = items[${j - 1}] (${a[j]} moves right).`, { ptr: { i, j }, vars: iv(), moved: [j], sorted });
      j--;
    }
    a[j] = item;
    snap(7, `Drop item into the gap: <b>items[${j}] = ${item}</b>.`, { ptr: { i, j }, vars: iv(), moved: [j], sorted: range(lo, i) });
  }
  snap(1, `i = ${i} is past hi, so the loop ends.`, { sorted: range(lo, hi) });
  snap(9, "Done. The array is sorted.", { sorted: range(lo, hi) });
  return steps;
}

const TRACERS = { selection: traceSelection, bubble: traceBubble, insertion: traceInsertion };
const MOVE_WORD = { selection: "swaps", bubble: "swaps", insertion: "shifts" };

// ---------- App state (like globals in a C program) ----------
let algo = "selection";
let data = [4, 2, 1, 5, 3];   // same array as the lecture walkthrough
let steps = [];
let pos = 0;
let timer = null;

const $ = id => document.getElementById(id);

// ---------- Syntax colouring for a line of C ----------
function colour(line) {
  const esc = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc
    .replace(/\b(void|int|Item|bool)\b/g, '<span class="t">$1</span>')
    .replace(/\b(for|if|break)\b/g, '<span class="k">$1</span>');
}

// ---------- Draw the current snapshot ----------
function draw() {
  const s = steps[pos];
  const n = s.arr.length;

  // Group pointer names by index so several can stack under one cell
  const under = {};
  for (const [name, idx] of Object.entries(s.ptr)) {
    if (idx >= 0 && idx < n) (under[idx] = under[idx] || []).push(name);
  }

  let cols = "";
  for (let k = 0; k < n; k++) {
    const top = [k === 0 ? "lo" : null, k === n - 1 ? "hi" : null].filter(Boolean);
    const cls = ["cell",
      s.moved.includes(k) ? "moved" : s.cmp.includes(k) ? "cmp" : s.sorted.includes(k) ? "sorted" : ""].join(" ");
    cols += `<div class="col">
      <div class="idx">[${k}]</div>
      <div class="top-tags">${top.map(t => `<div class="tag">${t}</div>`).join("")}</div>
      <div class="${cls}">${s.arr[k]}</div>
      <div class="bot-tags">${(under[k] || []).map(t => `<div class="tag">${t}</div>`).join("")}</div>
    </div>`;
  }
  const vars = s.vars.map(v => `<div class="var ${v.small ? "small" : ""}"><div class="box">${v.val}</div>${v.name}</div>`).join("");
  $("viz").innerHTML = `<div class="arr">${cols}</div>${vars ? `<div class="vars">${vars}</div>` : ""}`;

  $("caption").innerHTML = s.caption;
  $("code").innerHTML = CODE[algo].map((l, k) => `<span class="ln${k === s.line ? " cur" : ""}">${colour(l)}</span>`).join("");
  $("count").textContent = `step ${pos + 1} / ${steps.length}`;
  $("stats").textContent = `comparisons: ${s.stats.cmp}   ${MOVE_WORD[algo]}: ${s.stats.swaps}`;
  $("scrub").value = pos;

  $("first").disabled = $("prev").disabled = pos === 0;
  $("next").disabled = $("last").disabled = pos === steps.length - 1;
  if (pos === steps.length - 1) stop();
}

// ---------- Rebuild when the sort or the array changes ----------
function rebuild() {
  stop();
  steps = TRACERS[algo](data);
  pos = 0;
  $("scrub").max = steps.length - 1;
  $("title").textContent = `${TITLES[algo]} Walkthrough`;
  document.title = `${TITLES[algo]} Walkthrough`;
  [...$("tabs").children].forEach(b => b.setAttribute("aria-selected", String(b.dataset.algo === algo)));
  draw();
}

// ---------- Playback ----------
function go(p) { pos = Math.max(0, Math.min(steps.length - 1, p)); draw(); }
function play() {
  if (pos === steps.length - 1) pos = 0;
  $("play").textContent = "⏸ Pause";
  timer = setInterval(() => go(pos + 1), 700);
}
function stop() { clearInterval(timer); timer = null; $("play").textContent = "▶ Play"; }

// ---------- Wire up controls ----------
Object.keys(TITLES).forEach(key => {
  const b = document.createElement("button");
  b.textContent = TITLES[key];
  b.dataset.algo = key;
  b.setAttribute("role", "tab");
  b.addEventListener("click", () => { algo = key; rebuild(); });
  $("tabs").appendChild(b);
});
$("first").onclick = () => { stop(); go(0); };
$("prev").onclick  = () => { stop(); go(pos - 1); };
$("next").onclick  = () => { stop(); go(pos + 1); };
$("last").onclick  = () => { stop(); go(steps.length - 1); };
$("play").onclick  = () => (timer ? stop() : play());
$("scrub").oninput = e => { stop(); go(+e.target.value); };

function applyArray() {
  // Accept "4 2 1 5 3" or "4,2,1,5,3"; keep 2 to 10 whole numbers
  const nums = $("arrIn").value.split(/[\s,]+/).filter(Boolean).map(Number).filter(Number.isInteger).slice(0, 10);
  if (nums.length < 2) { $("caption").innerHTML = "Enter at least two whole numbers, e.g. <b>4 2 1 5 3</b>."; return; }
  data = nums;
  $("arrIn").value = nums.join(" ");
  rebuild();
}
$("apply").onclick = applyArray;
$("arrIn").addEventListener("keydown", e => { if (e.key === "Enter") applyArray(); });
$("rand").onclick = () => {
  const n = 5 + Math.floor(Math.random() * 3);
  $("arrIn").value = Array.from({ length: n }, () => 1 + Math.floor(Math.random() * 9)).join(" ");
  applyArray();
};

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") { stop(); go(pos + 1); }
  else if (e.key === "ArrowLeft") { stop(); go(pos - 1); }
  else if (e.key === " ") { e.preventDefault(); timer ? stop() : play(); }
});

rebuild();
</script>
</body>
</html>
